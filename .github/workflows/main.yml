name: My First CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run a simple test
        run: echo "CI pipeline is working!"

      - name: Use test secret
        env:
          MY_SECRET: ${{ secrets.MY_TEST_SECRET }}
        run: echo "The secret is available to the pipeline"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: cicd-app.txt
     
          
  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
      - name: Deploy to DEV
        run: echo "Deploying my-artifact to DEV..."
        
  deploy_test:
    needs: deploy_dev
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
      - name: Deploy to TEST
        run: echo "Deploying my-artifact to TEST..."
      - name: Validate TEST
        run: echo "TEST validation successful!"

  deploy_UAT:
    needs: deploy_test
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
      - name: Deploy to UAT
        run: echo "Deploying my-artifact to UAT..."
      - name: Validate UAT
        run: echo "UAT validation successful!"

  deploy_prod:
     needs: deploy_UAT
     runs-on: ubuntu-latest
     environment: production
     steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact

      - name: Deploy to PROD
        run: echo "Deploying my-artifact to PROD..."

      - name: Validate PROD
        run: echo "PROD deployment successful!"
        
          
